<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Tracker</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
}

.progress-box{
    margin:20px 0;
}

.progress-bar{
    width:100%;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.progress{
    height:25px;
    width:0%;
    background:#4CAF50;
    text-align:center;
    color:white;
    line-height:25px;
    transition:0.5s;
}

button{
    padding:10px 15px;
    background:#007BFF;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}
</style>
</head>
<body>

<div class="container">
    <h2>Learning Progress Tracker</h2>

    <div class="progress-box">
        <h3>HTML Course</h3>
        <div class="progress-bar">
            <div class="progress" id="htmlProgress">0%</div>
        </div>
    </div>

    <button onclick="updateProgress()">Complete Lesson</button>
</div>

<script>
let progress = 0;

function updateProgress(){
    if(progress < 100){
        progress += 10;

        document.getElementById("htmlProgress").style.width =
            progress + "%";

        document.getElementById("htmlProgress").innerText =
            progress + "%";
    }
}
</script>

</body>
</html>
