<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notes</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f7fc;
    margin:0;
}

nav{
    background:#2563eb;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
}

.container{
    width:80%;
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
}

textarea{
    width:100%;
    height:250px;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    resize:none;
    font-size:16px;
}

button{
    margin-top:15px;
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.message{
    text-align:center;
    color:green;
    margin-top:10px;
}
</style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="courses.html">Courses</a>
    <a href="planner.html">Study Planner</a>
    <a href="progress.html">Progress</a>
    <a href="notes.html">Notes</a>
</nav>

<div class="container">
    <h1>My Notes</h1>

    <textarea id="notes" placeholder="Write your notes here..."></textarea>

    <button onclick="saveNotes()">Save Notes</button>

    <p class="message" id="msg"></p>
</div>

<script>
window.onload = function(){
    document.getElementById("notes").value =
    localStorage.getItem("studentNotes") || "";
}

function saveNotes(){
    let notes =
    document.getElementById("notes").value;

    localStorage.setItem("studentNotes", notes);

    document.getElementById("msg").innerHTML =
    "Notes Saved Successfully!";
}
</script>

</body>
</html>
